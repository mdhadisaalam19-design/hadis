<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raju Illustration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      background: #2a2a2a;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: #ff4757;
    }

    svg {
      width: 320px;
      height: 380px;
    }

    /* SVG Style Tweaks */
    .skin { fill: #f1c27d; stroke: #333; stroke-width: 3; }
    .hair { fill: #2c3e50; }
    .shirt { fill: #ff4757; stroke: #333; stroke-width: 3; }
    .eyes { fill: #333; }
    .mouth { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; }
  </style>
</head>
<body>

  <div class="container">
    <h1>RAJU</h1>
    
    <svg viewBox="0 0 300 350">
      <!-- Hair Back -->
      <path class="hair" d="M 80 120 Q 70 40 150 40 Q 230 40 220 120 Z" />

      <!-- Head -->
      <circle class="skin" cx="150" cy="110" r="55" />

      <!-- Hair Front -->
      <path class="hair" d="M 95 90 Q 150 50 205 90 Q 180 70 150 75 Q 120 70 95 90 Z" />

      <!-- Eyes -->
      <circle class="eyes" cx="130" cy="105" r="6" />
      <circle class="eyes" cx="170" cy="105" r="6" />

      <!-- Eyebrows (Angry/Smug expression) -->
      <path d="M 120 92 L 140 98" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" />
      <path d="M 180 92 L 160 98" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" />

      <!-- Mouth (Smirk) -->
      <path class="mouth" d="M 135 130 Q 150 140 165 125" />

      <!-- Body / Shirt -->
      <path class="shirt" d="M 90 220 L 110 165 L 190 165 L 210 220 Z" />
      <rect class="skin" x="135" y="155" width="30" height="20" rx="5" />

      <!-- Arm raised holding middle finger -->
      <g transform="translate(40, -10)">
        <!-- Sleeve -->
        <path class="shirt" d="M 70 180 L 100 180 L 95 210 L 65 210 Z" />

        <!-- Arm -->
        <rect class="skin" x="70" y="190" width="22" height="60" rx="10" />

        <!-- Hand with Middle Finger Gesture -->
        <g transform="translate(61, 230)">
          <!-- Palm base -->
          <path class="skin" d="M 5 25 C 5 15, 35 15, 35 25 L 35 40 L 5 40 Z" />
          
          <!-- Folded Thumb -->
          <path class="skin" d="M 32 28 C 40 28, 38 38, 30 38" />

          <!-- Folded Index Finger -->
          <rect class="skin" x="8" y="20" width="7" height="12" rx="3" />

          <!-- Extended Middle Finger -->
          <rect class="skin" x="16" y="0" width="8" height="28" rx="4" />

          <!-- Folded Ring Finger -->
          <rect class="skin" x="25" y="20" width="6" height="12" rx="3" />

          <!-- Folded Pinky Finger -->
          <rect class="skin" x="31" y="23" width="5" height="10" rx="2" />
        </g>
      </g>
    </svg>
  </div>

</body>
</html>
